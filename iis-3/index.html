<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<meta name="robots" content="noindex, nofollow">
<title>Пенсия ИИС-3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark brokerage-app screen — balance-style hero, quote tile, grouped holding rows with monogram badges, monthly history, sticky action dock. Single dark look by choice. */
:root{
  --bg:#0B0B0C; --surface:#18181B; --raised:#222226; --ink:#F4F4F5; --muted:#8C8C94; --line:#2A2A2F;
  --accent:#6E9BFF; --accent-ink:#0A1023; --accent-soft:#18213A; --down:#F0605A; --warn:#F2B14C;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; color-scheme:dark;
  --tfs:15px; --tlogo:28px; --tlr:8px; --tgap:10px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;padding-block:20px 132px;display:grid;gap:22px}
.wrap>*,#app>*{min-width:0}
#app{display:grid;gap:22px;min-width:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}

/* top */
.top .acc{font-size:14px;color:var(--muted);white-space:nowrap}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.hero{display:grid;gap:6px}
.hero label{font-size:14px;color:var(--muted)}
.amount{display:flex;align-items:baseline;gap:4px}
.amount input{font:inherit;font-size:38px;font-weight:600;letter-spacing:-.02em;color:var(--ink);background:transparent;border:0;padding:0;
  font-variant-numeric:tabular-nums;max-width:100%;border-bottom:2px dashed var(--line);padding-bottom:2px}
.amount input:focus{outline:none;border-bottom:2px solid var(--accent)}
.amount .cur{font-size:38px;font-weight:600;color:var(--muted)}
.heroline{font-size:14px;color:var(--accent)}
.heroline .muted{color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px 12px;display:grid;gap:6px;min-width:0;border:0;color:var(--ink);text-align:left;font:inherit}
.tile small{font-size:12.5px;color:var(--muted)}
.tile b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.tile{cursor:pointer}
button.tile b{color:var(--accent)}
button.tile:disabled{opacity:.6;cursor:default}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ttl{display:grid;gap:4px;min-width:0}
.qbox{display:grid;justify-items:end;gap:6px;text-align:right;max-width:58%}
.qbox .qt{font-size:12px;color:var(--muted);line-height:1.3}
button.qbtn{padding:7px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13.5px}
.qline{font-size:11.5px;color:var(--muted);line-height:1.3}
.qline.err{color:var(--warn)}

/* sections */
.sec{display:grid;gap:4px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 2px 8px}
.sechead h2{font-size:18px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:8px}
.sechead h2 small{font-size:13px;font-weight:400;color:var(--muted)}
.sechead .r{font-size:15px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}

/* rows */
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 5.4ch auto 26px;gap:12px;align-items:center;padding:12px 0}
.row[data-t]{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.row[data-t] input.price{user-select:text}
.row.done .nm,.row.done .rt{opacity:.45}
.row .badge{transition:filter .2s,opacity .2s}
.row.done .badge{filter:grayscale(1);opacity:.45}
.row.done .rt b,.row.done .nm{text-decoration:line-through}
.ck{display:grid;place-items:center;cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border-radius:7px;border:2px solid #4A4A52;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ck input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.02em;color:#0B0B0C;overflow:hidden;flex:none}
.badge img{width:100%;height:100%;object-fit:cover;display:block}
.badge.s{width:22px;height:22px;font-size:8px;border-radius:6px}
.nmc{display:inline-flex;align-items:center;gap:8px}
.mid{min-width:0;display:grid;gap:3px}
.nm{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;white-space:nowrap;min-width:0}
.sub input{font:inherit;color:var(--muted);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:0;width:auto;font-variant-numeric:tabular-nums}
.sub input:focus{outline:none;color:var(--ink);border-bottom:1px solid var(--accent)}
.rt{text-align:right;display:grid;gap:3px}
.rt b{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt span{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--accent)}
.skip{color:var(--muted)}
.over{color:var(--down)}
.divtag{grid-column:2/-1;font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:6px 10px;margin-top:-4px}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.divbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--ink);font:inherit;font-weight:500;cursor:pointer;padding:0;border-radius:0}
.divbtn span:last-child{color:var(--muted);font-weight:400;font-size:14px}
.divgrid{display:grid;margin-top:10px}
.divgrid label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;min-width:0}
.divgrid label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divgrid input{width:110px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;background:var(--raised);color:var(--ink);border:0;border-radius:10px;padding:8px 10px}
.divgrid input:focus{outline:2px solid var(--accent)}

/* history */
.month{border-top:1px solid var(--line)}
.month:first-child{border-top:0}
.month summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:18px 0}
.month summary::-webkit-details-marker{display:none}
.month .mn{font-size:16px;font-weight:500}
.month .ms{font-size:13.5px;color:var(--muted);grid-column:1}
.month .mr{grid-column:2;grid-row:1/3;text-align:right;align-self:center}
.month .mr b{display:block;font-size:16px;font-weight:600}
.month .mr span{font-size:13px;color:var(--muted)}
.mbody{display:grid;padding:2px 0 18px}
.mline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;font-size:13.5px;padding:6px 0;align-items:center}
.mline .q{color:var(--muted)}
.more{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;padding:10px 0;cursor:pointer;border-radius:0}

/* positions */
details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-weight:500}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"Показать";color:var(--muted);font-weight:400;font-size:14px}
details.card[open] summary::after{content:"Скрыть"}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:var(--tfs)}
th,td{padding:11px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{font-size:12.5px;color:var(--muted);font-weight:400;padding-block:6px 10px}
th:first-child,td:first-child{text-align:left;padding-left:0;position:sticky;left:0;background:var(--surface);z-index:1}
th:last-child,td:last-child{padding-right:0}
td .nmc{display:flex;align-items:center;gap:var(--tgap)}
td .badge.s,.bline .badge.s,.cobar .badge.s{width:var(--tlogo);height:var(--tlogo);border-radius:var(--tlr)}

/* dividends tab */
.drow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .sub{white-space:normal}
.drow input{width:110px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;background:var(--raised);color:var(--ink);border:0;border-radius:10px;padding:9px 10px}
.drow input:focus{outline:2px solid var(--accent)}
@media (max-width:400px){.drow input{width:92px}}
button.divnote{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-weight:500;font-size:14px}
button.divnote span{color:var(--ink);font-weight:600}
.mline .q{white-space:nowrap}
.bline{display:grid;grid-template-columns:minmax(0,1fr) 4.4ch 6.4ch 6.6ch;gap:16px;font-variant-numeric:tabular-nums;align-items:center;font-size:var(--tfs);padding:11px 0;border-bottom:1px solid var(--line)}
.bline:last-child{border-bottom:0}
.bline .nmc{gap:var(--tgap)}
.bline>span:not(:first-child){text-align:right}
.bline.bh{font-size:12.5px;color:var(--muted);white-space:nowrap;padding:6px 0 10px}
.bline .nmc{min-width:0;display:flex;align-items:center}
.bline .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bline .num{white-space:nowrap}
.bline .q{color:var(--muted)}
.bline.c3{grid-template-columns:minmax(0,1fr) auto 8ch}
@media (max-width:400px){:root{--tfs:14px;--tlogo:24px;--tlr:7px;--tgap:8px}.bline{gap:6px}.card{padding-inline:14px}.mbody .bline .num{font-size:13.5px}}

/* dividend stats */
.ctitle{font-size:12.5px;color:var(--muted);padding:6px 0 10px}
.cnote{font-size:12.5px;color:var(--muted);margin-top:10px}
.mbars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:150px;align-items:end}
.mb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.mb .bar{width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 2px 2px}
.mb .mv{font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mb .ml{font-size:10.5px;color:var(--muted)}
.mb{position:relative}
.cobar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:11px 0;font-size:var(--tfs);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cobar:last-of-type{border-bottom:0}
.cobar .nmc{display:flex;align-items:center;gap:var(--tgap);min-width:0}
.cobar .track{grid-column:1;height:6px;background:var(--raised);border-radius:3px;overflow:hidden;align-self:center}
.cobar .track span{display:block;height:100%;background:var(--accent);border-radius:3px}
.cobar .pct{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sumgrid .tile small{line-height:1.25}

.bline .sold{grid-column:2/4;text-align:right}
.tnote{font-size:13px;color:var(--muted);padding:10px 0 2px}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow .rt span{color:var(--muted)}
.bline .pn{display:grid;min-width:0;gap:1px}
.bline .pn small,.bline .num small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.drow .sub span{white-space:nowrap}
.sumgrid .tile b{font-size:15px}
@media (max-width:400px){.sumgrid{gap:8px}.sumgrid .tile{padding:12px 10px}.sumgrid .tile b{font-size:14px}.sumgrid .tile small{font-size:12px}}
@media (max-width:400px){.mb .mv{font-size:9.5px;letter-spacing:-.02em}.mbars{gap:3px}}
@media (max-width:350px){.sub span,.drow .sub span{white-space:normal}.drow input{width:80px}.drow{gap:10px}.prow{gap:10px}}
.sweep{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border-radius:14px;padding:14px 16px}
.sweep.on{background:var(--accent-soft)}
.sweep div{display:grid;gap:4px;min-width:0}
.sweep b{font-weight:600}
.sweep small{font-size:13px;color:var(--muted);line-height:1.35}
.tgl{position:relative;flex:none;width:46px;height:28px;cursor:pointer}
.tgl input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tgl span{pointer-events:none;position:absolute;inset:0;border-radius:14px;background:var(--raised);transition:background .15s}
.tgl span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .15s}
.tgl input:checked+span{background:var(--accent)}
.tgl input:checked+span::after{transform:translateX(18px);background:var(--accent-ink)}
.tgl input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sell{color:var(--warn)}
.limit{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);padding:2px 0 4px}
.limit input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:0;text-align:right;font-variant-numeric:tabular-nums}
.limit input:focus{outline:none;border-bottom:1px solid var(--accent)}
.limit span{white-space:nowrap}
.nmline{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;min-width:0}
.nmline .nm{min-width:0;max-width:100%;flex:0 1 auto}
.shr{display:grid;justify-items:end;gap:3px;padding-right:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.shr b{font-size:15px;font-weight:500}
.shr span{font-size:13px;color:var(--muted)}
.shr.over b{color:var(--down)}
@media (max-width:400px){.row{gap:10px}.shr b{font-size:14px}}
.row.done .shr{opacity:.45}
.toast{position:fixed;left:50%;transform:translate(-50%,12px);z-index:20;width:min(560px,calc(100% - 32px));display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:12px;align-items:center;
  background:var(--raised);color:var(--ink);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ti{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.toast.err .ti{background:var(--down);color:#0B0B0C}
.toast .tx{display:grid;gap:2px;min-width:0}
.toast .tx b{font-weight:600;font-size:15px}
.toast .tx span{font-size:13px;color:var(--muted)}
.toast button{padding:8px 10px;border-radius:10px;font-size:14px;background:transparent}
.toast .tu{color:var(--accent)}
.toast .tc{color:var(--muted);font-size:20px;line-height:1;padding:6px 8px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--surface);border-radius:14px;padding:4px}
.tabs button{min-width:0;padding:10px 4px;border-radius:11px;background:transparent;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.tabs button{font-size:12.5px;padding:10px 0;letter-spacing:-.01em}}
@media (max-width:350px){.tabs button{font-size:12px}}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);font-weight:600}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:960px;margin:0 auto;display:grid;gap:10px}
.dockrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tot{display:grid;min-width:0}
.tot small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.tot small{font-size:12.5px;color:var(--muted)}
.tot .of{font-size:13px;font-weight:400;color:var(--muted)}
button{font:inherit;font-weight:600;border-radius:14px;padding:13px 18px;cursor:pointer;border:0;background:var(--raised);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);white-space:nowrap}
@media (max-width:400px){.dock button{padding:12px 14px}.tot b{font-size:16px}}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.confirm{font-size:14px;background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px}
.confirm .btns{display:flex;gap:8px;justify-content:flex-end}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
</style>

<style>
body{margin:0}
</style>
<div class="wrap">
  <div class="top">
    <div class="ttl"><span class="acc">ИИС-3 · Сбер</span><h1>Пенсия</h1></div>
    <div class="qbox" id="qbox"></div>
  </div>
  <div id="app" class="empty">Загружаю портфель…</div>
</div>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
// ── шлюз на пароле: AES-GCM + PBKDF2 через встроенный WebCrypto ──
function vaultGate(VAULT, cfg, onOpen){
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b)));
  const enc=new TextEncoder();
  const saved=()=>{ try{ const s=JSON.parse(localStorage.getItem(cfg.store)||"null"); return (s&&s.k)?s:null; }catch(e){ return null; } };
  const forget=()=>{ try{ localStorage.removeItem(cfg.store); }catch(e){} };
  async function keyFromPass(pass){
    const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(VAULT.salt),iterations:VAULT.iter,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function openKey(key){
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(VAULT.iv)},key,b64d(VAULT.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  // 1) уже разблокировано на этом устройстве?
  const s=saved();
  if(s){
    (async()=>{ try{
      const key=await crypto.subtle.importKey("raw",b64d(s.k),{name:"AES-GCM"},true,["decrypt"]);
      onOpen(await openKey(key));
    }catch(e){ forget(); show(); } })();
    return;
  }
  show();

  function show(){
    const ov=document.createElement("div");
    ov.id="vaultGate";
    ov.innerHTML=`<style>
      #vaultGate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;
        background:${cfg.bg};color:${cfg.fg};font:15px/1.45 ${cfg.font};overflow:auto}
      #vaultGate .card{width:100%;max-width:380px;background:${cfg.surface};border:1px solid ${cfg.line};
        border-radius:16px;padding:24px;display:grid;gap:14px}
      #vaultGate h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
      #vaultGate p{margin:0;font-size:13.5px;color:${cfg.muted}}

const fmt=(n,d=0)=>Number(n).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const rub=(n,d=0)=>fmt(n,d)+" ₽";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c)};
const lotsWord=n=>fmt(n)+" "+plural(n,"лот","лота","лотов");
const NAMES={SNGSP:"Сургутнефтегаз-п",SBMM:"SBMM"};
const SECTOR={SBER:"#5BC27A",DOMRF:"#7FA8F5",LKOH:"#F2A24C",TATNP:"#E8C25A",SIBN:"#6FB4F0",ROSN:"#F2C94C",TRNFP:"#9AA7F7",
  NLMK:"#8EC5D6",CHMF:"#77A6E8",PHOR:"#7DD3B0",X5:"#B7DD6A",IRAO:"#F0907A",LSNGP:"#C5A3F2",SNGSP:"#D9B36C"};

const toNum=v=>{const x=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0};
function calcPlan(holdings, topup, prices, divs, extra) {
  const exOwn = (extra && extra.own) || 0, exFree = (extra && extra.free) || 0;
  const budget = topup + exOwn + exFree, ownFrac = budget > 0 ? (topup + exOwn) / budget : 1;
  const rows = holdings.map(h => {
    const price = toNum(prices[h.t]) || h.price;
    const lotCost = price * h.lot;
    const div = toNum(divs[h.t]) || 0;
    const divLots = lotCost > 0 ? Math.floor(div / lotCost) : 0;
    return { ...h, price, lotCost, div, divLots, divSpend: divLots * lotCost, divRest: div - divLots * lotCost };
  });
  const ownTotal = rows.reduce((s, r) => s + r.own, 0);
  const base = ownTotal + budget;
  rows.forEach(r => {
    r.need = (r.w / 100) * base - r.own;
    r.lots = r.lotCost > 0 ? Math.max(0, Math.floor(r.need / r.lotCost)) : 0;
  });
  let spent = rows.reduce((s, r) => s + r.lots * r.lotCost, 0);
  for (;;) {
    const rem = budget - spent;
    let best = null;
    for (const r of rows) {
      if (r.lotCost > rem + 1e-9) continue;
      const gap = r.need - r.lots * r.lotCost;
      if (gap < r.lotCost / 2) continue; // добираем лот, только если он приближает бумагу к цели
      if (!best || gap > best.gap) best = { r, gap };
    }
    if (!best) break;
    best.r.lots += 1;
    spent += best.r.lotCost;
  }
  rows.forEach(r => { r.spend = r.lots * r.lotCost; r.ownAdd = r.spend * ownFrac; r.ownAfter = r.own + r.ownAdd; });
  const ownAfter = rows.reduce((a, r) => a + r.ownAfter, 0);
  rows.forEach(r => { r.shareAfter = ownAfter > 0 ? (r.ownAfter / ownAfter) * 100 : 0; r.shareNow = ownTotal>0 ? r.own/ownTotal*100 : 0; });
  const divIn = rows.reduce((s, r) => s + r.div, 0);
  const divSpent = rows.reduce((s, r) => s + r.divSpend, 0);
  return { rows, ownTotal, ownAfter, base, budget, ownFrac, spent, topupRest: budget - spent, divIn, divSpent, divRest: divIn - divSpent };
}

function sweepInfo(){
  const px=toNum(draft.prices.SBMM)||state.sbmm.price, qty=state.sbmm.qty||0, value=qty*px;
  const limit=state.sbmmLimit??10000, over=value>=limit&&qty>0;
  const on=over&&(draft.sweep??true);
  const divPart=on?Math.min(state.sbmm.divCash||0,value):0;
  return {px,qty,value,limit,over,on,sellQty:on?qty:0,own:on?value-divPart:0,free:divPart};
}
function plan(){
  const topup = draft.topup ?? state.topup ?? 60000;
  const sw = sweepInfo();
  return { topup, sw, p: calcPlan(state.holdings, topup, draft.prices, draft.divs, sw.on?{own:sw.own,free:sw.free}:null) };
}

function keepFocus(fn){
  const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;
  fn();
  if(id){const el=document.getElementById(id);if(el&&el.tagName==="INPUT"){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0};

function bind(){
  const t=document.getElementById("topup");
  if(t) t.addEventListener("input",()=>{draft.topup=num(t.value);keepFocus(render)});
  document.querySelectorAll("input.price").forEach(i=>i.addEventListener("input",()=>{
    if(num(i.value)>0) draft.prices[i.dataset.t]=i.value; else delete draft.prices[i.dataset.t]; keepFocus(render)}));
  document.querySelectorAll("input.div").forEach(i=>i.addEventListener("input",()=>{
    if(i.value.trim()) draft.divs[i.dataset.t]=i.value; else delete draft.divs[i.dataset.t]; keepFocus(render)}));
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  document.querySelectorAll(".row[data-t]").forEach(row=>row.addEventListener("click",e=>{
    if(e.target.closest("input,label,button")) return;
    const c=document.getElementById("c-"+row.dataset.t); if(!c) return;
    c.checked=!c.checked; c.dispatchEvent(new Event("change"));
  }));
  document.querySelectorAll("input.bought").forEach(c=>c.addEventListener("change",async()=>{
    ckState={...ckState,[c.dataset.t]:c.checked};
    msg=""; keepFocus(render);
    try{ await ref.update({checked:ckState}); }catch(e){}
  }));
  const swc=document.getElementById("sweep"); if(swc) swc.addEventListener("change",()=>{draft.sweep=swc.checked;render();});
  const lim=document.getElementById("sblimit"); if(lim){ lim.addEventListener("click",e=>e.stopPropagation()); lim.addEventListener("change",async()=>{const v=Math.max(0,Math.round(toNum(lim.value)));try{await ref.update({sbmmLimit:v});}catch(e){} }); }
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{view=b.dataset.goto;try{history.replaceState(null,"","#"+view)}catch(e){}render();window.scrollTo(0,0)});
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.v;confirming=false;try{history.replaceState(null,"","#"+view)}catch(e){}render();window.scrollTo(0,0)});
  on("refresh",()=>refreshQuotes(true));
  on("rec",()=>{confirming=true;msg="";render()});
  on("cancel",()=>{confirming=false;render()});
  on("ok",()=>record(view==="divs")); on("undo",undo);
}

function merge(items,key,patch){
  const list=JSON.parse(JSON.stringify(items||[]));
  let m=list.find(x=>x.month===key);
  if(!m){m={month:key,deposit:0,transfer:0,div:0,divBy:{},bought:0,buys:{},sold:{}};list.push(m);}
  m.deposit=+((m.deposit||0)+patch.deposit).toFixed(2);
  m.div=+((m.div||0)+patch.div).toFixed(2);
  if(patch.fromSbmm) m.fromSbmm=+((m.fromSbmm||0)+patch.fromSbmm).toFixed(2);
  m.bought=+((m.bought||0)+patch.bought).toFixed(2);
  m.divBy=m.divBy||{}; for(const [t,v] of Object.entries(patch.divBy)) m.divBy[t]=+((m.divBy[t]||0)+v).toFixed(2);
  m.buys=m.buys||{}; for(const [t,[q,s,pr]] of Object.entries(patch.buys)){const o=m.buys[t]||[0,0,0];const nq=o[0]+q;m.buys[t]=[nq,+(o[1]+s).toFixed(2),+(((o[0]*(o[2]||pr))+q*pr)/nq).toFixed(4)];}
  return list;
}

async function record(onlyDivs){
  const {topup,p,sw}=onlyDivs?{topup:0,p:calcPlan(state.holdings,0,draft.prices,draft.divs),sw:{on:false,sellQty:0,own:0,free:0,value:0}}:plan();
  busy=true;render();
  const strip=s=>{const {undo,...rest}=s;return JSON.parse(JSON.stringify(rest))};
  const prev=strip(state); prev.months=JSON.parse(JSON.stringify(months&&months.items||[]));
  const toSbmm=p.topupRest+p.divRest;
  const next=strip(state);
  next.holdings=state.holdings.map(h=>{const r=p.rows.find(x=>x.t===h.t);
    return {...h,price:r.price,qty:h.qty+(r.lots+r.divLots)*h.lot,own:+(h.own+r.ownAdd).toFixed(2),
      invested:+((h.invested||0)+r.spend+r.divSpend).toFixed(2),divs:+((h.divs||0)+r.div).toFixed(2)}});
  const sbPx=toNum(draft.prices.SBMM)||state.sbmm.price;
  next.sbmm={...state.sbmm,price:sbPx,qty:state.sbmm.qty-sw.sellQty+Math.floor(toSbmm/sbPx+1e-9),
    divCash:+(Math.max(0,(state.sbmm.divCash||0)-sw.free)+p.divRest).toFixed(2)};
  next.topup=onlyDivs?state.topup:topup;
  next.updatedAt=new Date().toISOString().slice(0,10);
  next.undo=prev; if(!onlyDivs) next.checked={};
  const key=next.updatedAt.slice(0,7);
  const buys={}; p.rows.forEach(r=>{const q=(r.lots+r.divLots)*r.lot; if(q) buys[r.t]=[q,+(r.spend+r.divSpend).toFixed(2),r.price];});
  const divBy={}; p.rows.forEach(r=>{if(r.div) divBy[r.t]=r.div;});
  const items=merge(months&&months.items,key,{deposit:topup,fromSbmm:sw.on?+sw.value.toFixed(2):0,div:p.divIn,bought:p.spent+p.divSpent,divBy,buys});
  try{
    await mref.set({items});
    await ref.set(next);
    msg=""; draft.divs={}; divOpen=false; if(!onlyDivs){draft.topup=null; draft.prices={};}
    const nPapers=p.rows.filter(r=>r.lots||r.divLots).length;
    toast(onlyDivs?"Дивиденды записаны":"Покупки записаны",
      `${nPapers} ${plural(nPapers,"бумага","бумаги","бумаг")} на ${rub(p.spent+p.divSpent)} · в SBMM ${rub(toSbmm)}. Позиции и история обновлены.`,"ok",true);
  }catch(e){ const no=e&&e.code==="invalid_argument"; if(no) canWrite=false; msg="";
    toast("Не записано", no?"Нет прав на запись в эту страницу.":"Не удалось сохранить. Проверь связь и попробуй ещё раз.","err"); }
  busy=false;confirming=false;render();
}
async function undo(){
  if(!state.undo) return;
  busy=true;render();
  const {months:prevMonths,...prevState}=state.undo;
  try{
    if(prevMonths) await mref.set({items:prevMonths});
    await ref.set(prevState);
    msg=""; toast("Запись отменена","Позиции и история вернулись к прошлому состоянию.","ok");
  }catch(e){ msg=""; toast("Не отменено","Не удалось отменить запись. Попробуй ещё раз.","err"); }
  busy=false;render();
}

const MOEX="https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities.json?securities="+
  "SBER,LKOH,TATNP,DOMRF,PHOR,NLMK,SIBN,ROSN,CHMF,TRNFP,X5,IRAO,LSNGP&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME&iss.meta=off";

function setQ(text,err){qmsg=text||"";qerr=!!err;keepFocus(render);}
async function initQuotes(){ refreshQuotes(); }
async function refreshQuotes(manual){
  if(quoting||!state) return;
  quoting=true;setQ("");
  try{
    const res=await fetch(MOEX,{cache:"no-store"});
    if(!res.ok) throw {code:"net"};
    const j=await res.json();
    const md=j.marketdata; const px={};
    md.data.forEach(row=>{const o={};md.columns.forEach((c,k)=>o[c]=row[k]);const v=o.LAST||o.LCURRENTPRICE;if(v>0)px[o.SECID]=v;});
    const n=Object.keys(px).length; if(!n) throw {code:"empty"};
    const holdings=JSON.parse(JSON.stringify(state.holdings)).map(h=>px[h.t]?{...h,price:px[h.t]}:h);
    await ref.update({holdings,priceAt:new Date().toISOString()});
    draft.prices={};
    quoting=false; setQ(n<13?`Обновлено ${n} из 13 бумаг, у остальных старые цены.`:"");
    if(manual) toast("Цены обновлены",`Котировки Мосбиржи на ${priceStamp()} МСК.`,"ok");
  }catch(e){
    quoting=false;
    setQ(e&&e.code==="empty"?"Биржа ответила без цен. Возможно, торги ещё не начались.":"Не получилось получить котировки. Попробуй ещё раз.",true);
  }
}

function toast(title,text,kind,withUndo){
  const el=document.getElementById("toast"); if(!el) return;
  const place=()=>{const dock=document.getElementById("dock");const vis=dock&&!dock.hidden;
    el.style.bottom=`calc(${(vis?dock.offsetHeight:0)+12}px + ${vis?"0px":"env(safe-area-inset-bottom, 0px)"})`;};
  setTimeout(place,0); setTimeout(place,250);
  el.className="toast "+(kind||"ok");
  el.innerHTML=`<span class="ti" aria-hidden="true">${kind==="err"?"!":"✓"}</span><div class="tx"><b>${esc(title)}</b>${text?`<span>${esc(text)}</span>`:""}</div>${withUndo?`<button class="tu" id="toastUndo">Отменить</button>`:""}<button class="tc" id="toastClose" aria-label="Закрыть">×</button>`;
  el.hidden=false; requestAnimationFrame(()=>el.classList.add("show"));
  const u=document.getElementById("toastUndo"); if(u) u.onclick=()=>{hideToast();undo();};
  document.getElementById("toastClose").onclick=hideToast;
  clearTimeout(toastT); toastT=setTimeout(hideToast,kind==="err"?9000:6000);
}

const LSKEY="iis3-docs-v1";
const deep=o=>JSON.parse(JSON.stringify(o));
let store=null, SEED=null;
try{ store=JSON.parse(localStorage.getItem(LSKEY)); }catch(e){ store=null; }
const subs={};
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify(store)); }catch(e){} }
function emit(path){ const s={exists:!!store[path], data:()=>deep(store[path])}; (subs[path]||[]).forEach(cb=>cb(s)); }
const db={ doc:path=>({
  onSnapshot(cb){ (subs[path]=subs[path]||[]).push(cb); cb({exists:!!store[path], data:()=>deep(store[path])}); },
  async get(){ return {exists:!!store[path], data:()=>deep(store[path])}; },
  async set(obj){ store[path]=deep(obj); persist(); emit(path); },
  async update(patch){ store[path]=Object.assign({}, store[path], deep(patch)); persist(); emit(path); }
})};
vaultGate(VAULT,{store:"iis3-unlock-v1",title:"Портфель закрыт",sub:"Введи пароль-фразу, чтобы открыть табло ИИС-3.",
  note:"Запоминается на этом устройстве",bg:"#0B0B0C",surface:"#18181B",line:"#2A2A2F",fg:"#F4F4F5",
  muted:"#8C8C94",accent:"#6E9BFF",accentInk:"#0A1023",err:"#F0605A",fieldBg:"#222226",font:"'Golos Text',system-ui,sans-serif"},
  data=>{
    SEED=data;
    if(!store) store=deep(SEED);
    ref=db.doc("portfolio/state"); mref=db.doc("portfolio/months");
    mref.onSnapshot(s=>{months=s.exists?s.data():{items:[]}; if(state) keepFocus(render);},()=>{});
    ref.onSnapshot(s=>{
      if(!s.exists){document.getElementById("app").textContent="Портфель ещё не загружен.";return;}
      state=s.data(); ckState={...(state.checked||{})}; keepFocus(render);
      if(!booted){booted=true;initQuotes();}
    },()=>{msg="Связь с хранилищем потеряна, обнови страницу";state&&render();});
  });
</script>
